name: Wheels

# Builds the binaries-only Python wheels (pyproject.toml) with cibuildwheel
# and the source distribution, tests each wheel (admin/wheels/check_wheel.py)
# and uploads them as artifacts. When a release is published on GitHub, the
# job publish uploads them to PyPI as percolator-cpp (pyproject.toml).
on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - pyproject.toml
      - python/**
      - admin/wheels/**
      - .github/workflows/wheels.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheel:
    name: wheel-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: windows-amd64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: build_and_test
      # one py3-none-<platform> wheel; the test command runs the installed
      # percolator and qvality commands
      uses: pypa/cibuildwheel@v3.2.1
      with:
        output-dir: wheelhouse
    - name: check_contents
      shell: bash
      run: |
        python=$(command -v python || command -v python3)
        "$python" admin/wheels/check_wheel.py --wheel wheelhouse/*.whl
    - name: check_macos_binaries
      # minos 12.0, and no Homebrew library (libomp is linked statically)
      if: runner.os == 'macOS'
      run: |
        unzip -q wheelhouse/*.whl -d unpacked
        for bin in unpacked/percolator_launcher/bin/percolator unpacked/percolator_launcher/bin/qvality; do
          lipo -info "$bin"
          libs=$(otool -L "$bin")
          echo "$libs"
          minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/ {f = 1} f && $1 == "minos" && !done {print $2; done = 1}')
          echo "minos $minos"
          test "$minos" = "12.0"
          if grep -q -e libomp -e /opt/homebrew -e /usr/local <<< "$libs"; then
            echo "$bin needs a library that the wheel does not hold"
            exit 1
          fi
        done
    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.platform }}
        path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build
      run: pipx run build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  # Uploads the five wheels and the source distribution to PyPI when a
  # release of percolator/percolator is published. PyPI accepts the upload by
  # trusted publishing (OpenID Connect): the project percolator-cpp names this
  # repository and this workflow as its publisher, so no token is stored. The
  # version comes from CommonCMake.txt ("3.09.0" becomes 3.9.0); PyPI refuses
  # a version it already holds, so the version is raised before a release.
  publish:
    if: github.event_name == 'release' && github.repository == 'percolator/percolator'
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/percolator-cpp/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: list
      # five wheels and one source distribution, or nothing is uploaded
      shell: bash
      run: |
        ls -l dist
        test "$(ls dist/*.whl | wc -l)" -eq 5
        test "$(ls dist/*.tar.gz | wc -l)" -eq 1
    - uses: pypa/gh-action-pypi-publish@release/v1
